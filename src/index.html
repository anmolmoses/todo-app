<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="category.css" />
  <link rel="stylesheet" href="todo.css" />
  <link rel="stylesheet" href="progress.css" />
</head>
<body>
  <div class="app">
    <header class="app__header glass">
      <h1 class="app__title">Today's Tasks</h1>
      <div class="progress" role="status" aria-label="Task completion progress"></div>
    </header>

    <main class="app__content">
      <!-- Morning Routine -->
      <details class="category glass" open>
        <summary class="category__header">
          <span class="category__icon">🌅</span>
          <span class="category__title">Morning Routine</span>
          <span class="category__chevron"></span>
        </summary>
        <ul class="category__list">
          <li class="todo" id="todo-1">
            <input type="checkbox" id="check-1" class="todo__checkbox sr-only" />
            <label for="check-1" class="todo__label">
              <span class="todo__text">Meditate for 10 minutes</span>
              <span class="todo__tag todo__tag--low">low</span>
            </label>
          </li>
          <li class="todo" id="todo-2">
            <input type="checkbox" id="check-2" class="todo__checkbox sr-only" />
            <label for="check-2" class="todo__label">
              <span class="todo__text">Review daily goals</span>
              <span class="todo__tag todo__tag--medium">medium</span>
            </label>
          </li>
          <li class="todo" id="todo-3">
            <input type="checkbox" id="check-3" class="todo__checkbox sr-only" />
            <label for="check-3" class="todo__label">
              <span class="todo__text">Morning workout</span>
              <span class="todo__tag todo__tag--high">high</span>
            </label>
          </li>
        </ul>
      </details>

      <!-- Work -->
      <details class="category glass" open>
        <summary class="category__header">
          <span class="category__icon">💼</span>
          <span class="category__title">Work</span>
          <span class="category__chevron"></span>
        </summary>
        <ul class="category__list">
          <li class="todo" id="todo-4">
            <input type="checkbox" id="check-4" class="todo__checkbox sr-only" />
            <label for="check-4" class="todo__label">
              <span class="todo__text">Check emails and Slack</span>
              <span class="todo__tag todo__tag--medium">medium</span>
            </label>
          </li>
          <li class="todo" id="todo-5">
            <input type="checkbox" id="check-5" class="todo__checkbox sr-only" />
            <label for="check-5" class="todo__label">
              <span class="todo__text">Ship feature update</span>
              <span class="todo__tag todo__tag--high">high</span>
            </label>
          </li>
          <li class="todo" id="todo-6">
            <input type="checkbox" id="check-6" class="todo__checkbox sr-only" />
            <label for="check-6" class="todo__label">
              <span class="todo__text">Code review PRs</span>
              <span class="todo__tag todo__tag--medium">medium</span>
            </label>
          </li>
          <li class="todo" id="todo-7">
            <input type="checkbox" id="check-7" class="todo__checkbox sr-only" />
            <label for="check-7" class="todo__label">
              <span class="todo__text">Update project docs</span>
              <span class="todo__tag todo__tag--low">low</span>
            </label>
          </li>
        </ul>
      </details>

      <!-- Evening -->
      <details class="category glass" open>
        <summary class="category__header">
          <span class="category__icon">🌙</span>
          <span class="category__title">Evening</span>
          <span class="category__chevron"></span>
        </summary>
        <ul class="category__list">
          <li class="todo" id="todo-8">
            <input type="checkbox" id="check-8" class="todo__checkbox sr-only" />
            <label for="check-8" class="todo__label">
              <span class="todo__text">Read for 30 minutes</span>
              <span class="todo__tag todo__tag--low">low</span>
            </label>
          </li>
          <li class="todo" id="todo-9">
            <input type="checkbox" id="check-9" class="todo__checkbox sr-only" />
            <label for="check-9" class="todo__label">
              <span class="todo__text">Plan tomorrow's tasks</span>
              <span class="todo__tag todo__tag--medium">medium</span>
            </label>
          </li>
          <li class="todo" id="todo-10">
            <input type="checkbox" id="check-10" class="todo__checkbox sr-only" />
            <label for="check-10" class="todo__label">
              <span class="todo__text">Digital detox by 10pm</span>
              <span class="todo__tag todo__tag--high">high</span>
            </label>
          </li>
        </ul>
      </details>
    </main>
  </div>
</body>
</html>
