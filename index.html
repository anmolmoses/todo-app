<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahintodew — Daily Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/base.css">
  <link rel="stylesheet" href="src/category.css">
  <link rel="stylesheet" href="src/todo.css">
  <link rel="stylesheet" href="src/header.css">
</head>
<body>
  <div class="app">

    <!-- Header (dev-1 scaffold) -->
    <header class="header header--sticky glass">
      <h1 class="header__title">Ahintodew</h1>
      <p class="header__subtitle">A fresh start, every morning</p>
      <div class="header__counter"></div>
    </header>

    <!-- Categories -->
    <main>

      <!-- 🌅 Morning Routine -->
      <details class="category glass" open>
        <summary class="category__header">
          <span class="category__icon">🌅</span>
          <span class="category__title">Morning Routine</span>
          <span class="category__count"></span>
          <span class="category__chevron"></span>
        </summary>
        <ul class="category__list">
          <li class="todo">
            <input type="checkbox" id="todo-1" class="todo__checkbox sr-only">
            <label for="todo-1" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Meditate for 10 minutes</span>
              <span class="todo__tag todo__tag--low">low</span>
            </label>
          </li>
          <li class="todo">
            <input type="checkbox" id="todo-2" class="todo__checkbox sr-only">
            <label for="todo-2" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Review daily goals</span>
              <span class="todo__tag todo__tag--medium">medium</span>
            </label>
          </li>
          <li class="todo">
            <input type="checkbox" id="todo-3" class="todo__checkbox sr-only">
            <label for="todo-3" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Morning workout</span>
              <span class="todo__tag todo__tag--high">high</span>
            </label>
          </li>
        </ul>
      </details>

      <!-- 💼 Work -->
      <details class="category glass" open>
        <summary class="category__header">
          <span class="category__icon">💼</span>
          <span class="category__title">Work</span>
          <span class="category__count"></span>
          <span class="category__chevron"></span>
        </summary>
        <ul class="category__list">
          <li class="todo">
            <input type="checkbox" id="todo-4" class="todo__checkbox sr-only">
            <label for="todo-4" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Check emails and Slack</span>
              <span class="todo__tag todo__tag--medium">medium</span>
            </label>
          </li>
          <li class="todo">
            <input type="checkbox" id="todo-5" class="todo__checkbox sr-only">
            <label for="todo-5" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Ship feature update</span>
              <span class="todo__tag todo__tag--high">high</span>
            </label>
          </li>
          <li class="todo">
            <input type="checkbox" id="todo-6" class="todo__checkbox sr-only">
            <label for="todo-6" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Code review PRs</span>
              <span class="todo__tag todo__tag--medium">medium</span>
            </label>
          </li>
          <li class="todo">
            <input type="checkbox" id="todo-7" class="todo__checkbox sr-only">
            <label for="todo-7" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Update project docs</span>
              <span class="todo__tag todo__tag--low">low</span>
            </label>
          </li>
        </ul>
      </details>

      <!-- 🌙 Evening -->
      <details class="category glass" open>
        <summary class="category__header">
          <span class="category__icon">🌙</span>
          <span class="category__title">Evening</span>
          <span class="category__count"></span>
          <span class="category__chevron"></span>
        </summary>
        <ul class="category__list">
          <li class="todo">
            <input type="checkbox" id="todo-8" class="todo__checkbox sr-only">
            <label for="todo-8" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Read for 30 minutes</span>
              <span class="todo__tag todo__tag--low">low</span>
            </label>
          </li>
          <li class="todo">
            <input type="checkbox" id="todo-9" class="todo__checkbox sr-only">
            <label for="todo-9" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Plan tomorrow's tasks</span>
              <span class="todo__tag todo__tag--medium">medium</span>
            </label>
          </li>
          <li class="todo">
            <input type="checkbox" id="todo-10" class="todo__checkbox sr-only">
            <label for="todo-10" class="todo__label">
              <span class="todo__checkmark"></span>
              <span class="todo__text">Digital detox by 10pm</span>
              <span class="todo__tag todo__tag--high">high</span>
            </label>
          </li>
        </ul>
      </details>

    </main>

  </div>
</body>
</html>
